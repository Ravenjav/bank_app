app:
  version: 0.0.2
  description: Система учёта банковских заявок

server:
  port: 8081

spring:
  application:
    name: bank_app
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: su
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql